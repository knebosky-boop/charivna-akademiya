<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1040">
<title>Чарівна академія</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--gold:#ffd66b;--bg1:#120a2e;--bg2:#3a1c71;--card:rgba(255,255,255,.09);--ok:#3ddc97;--bad:#ff6b8b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#fff;background:radial-gradient(ellipse at top,#4b2a8f 0%,var(--bg2) 35%,var(--bg1) 100%) fixed;overflow-x:hidden;-webkit-user-select:none;user-select:none}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:.7;animation:tw 3s infinite ease-in-out}
@keyframes tw{50%{opacity:.15}}
#app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:16px 16px 40px;padding-top:max(16px,env(safe-area-inset-top))}
h1{font-size:28px;margin:8px 0 4px;color:var(--gold);text-align:center}
h2{font-size:22px;margin:4px 0 12px;color:var(--gold)}
.sub{text-align:center;opacity:.85;margin-bottom:16px;font-size:17px}
.card{background:var(--card);border:1px solid rgba(255,214,107,.25);border-radius:20px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px;font-size:20px;font-weight:700;color:#2a1450;background:linear-gradient(180deg,#ffe28a,#ffc23d);box-shadow:0 4px 0 #b9821a;margin:12px 0;cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b9821a}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.towers{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.tower{background:var(--card);border-radius:20px;padding:16px 10px;text-align:center;border:2px solid rgba(255,214,107,.2);cursor:pointer;color:#fff;font-family:inherit}
.tower .ic{font-size:48px}
.tower .nm{font-weight:700;font-size:17px;margin:6px 0}
.tower .pr{font-size:14px;opacity:.85}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.iconbtn{background:rgba(255,255,255,.12);border:0;color:#fff;font-size:22px;border-radius:12px;width:46px;height:46px;cursor:pointer;flex:none}
.rank{font-size:15px;opacity:.9}
.lvl{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:14px;margin:10px 0;cursor:pointer;border:0;width:100%;color:#fff;font-size:18px;text-align:left;font-family:inherit}
.lvl .n{width:40px;height:40px;border-radius:50%;background:rgba(255,214,107,.2);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.lvl .t{flex:1}
.lvl .s{color:var(--gold);flex:none;font-size:16px}
.lvl.locked{opacity:.45}
.bar{height:10px;background:rgba(255,255,255,.15);border-radius:5px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd66b,#ff9ad5);transition:width .3s}
.owl{display:flex;gap:10px;align-items:flex-start;margin:14px 0}
.owl .o{font-size:40px;flex:none}
.owl .say{background:rgba(255,255,255,.12);border-radius:16px;padding:10px 14px;font-size:16px}
.q{font-size:24px;line-height:1.4;text-align:center;margin:12px 0 18px;font-weight:600}
.big{font-size:84px;text-align:center;line-height:1.1;margin:6px 0}
.num{font-size:72px;text-align:center;font-weight:800;color:var(--gold)}
.sw{width:110px;height:110px;border-radius:50%;margin:6px auto;border:3px solid rgba(255,255,255,.8)}
.opts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.opts.one{grid-template-columns:minmax(0,1fr)}
.tower,.opt,.q,.say{overflow-wrap:anywhere}
.opt{min-height:64px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:#fff;font-size:21px;border-radius:16px;padding:10px;cursor:pointer;font-weight:600;font-family:inherit}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#06301f}
.opt.bad{background:var(--bad);border-color:var(--bad);color:#3a0614}
.fb{border-radius:16px;padding:14px;margin-top:14px;font-size:18px;line-height:1.45}
.fb.ok{background:rgba(61,220,151,.18);border:1px solid var(--ok)}
.fb.bad{background:rgba(255,107,139,.15);border:1px solid var(--bad)}
.disp{font-size:40px;text-align:center;background:rgba(0,0,0,.25);border-radius:16px;padding:10px;min-height:68px;letter-spacing:2px;margin:6px 0 12px;font-weight:700}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kp button{height:62px;font-size:28px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:#fff;font-weight:700;cursor:pointer;font-family:inherit}
.kp button.go{background:linear-gradient(180deg,#ffe28a,#ffc23d);color:#2a1450}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.85em;line-height:1.05;margin:0 4px}
.frac span:first-child{border-bottom:2px solid #fff;padding:0 4px}
.stars{font-size:64px;text-align:center;letter-spacing:6px;margin:10px 0}
.stars .off{opacity:.2}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.art{background:var(--card);border-radius:16px;padding:10px 6px;text-align:center;font-size:13px}
.art .e{font-size:40px}
.art.no{opacity:.35}
input.name{width:100%;font-size:22px;padding:14px;border-radius:14px;border:2px solid var(--gold);background:rgba(0,0,0,.25);color:#fff;text-align:center;font-family:inherit;-webkit-user-select:text;user-select:text}
.speak{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:50%;width:76px;height:76px;font-size:38px;display:block;margin:6px auto;cursor:pointer}
.small{font-size:15px;opacity:.75}
.center{text-align:center}
@media (max-width:380px){.q{font-size:21px}.opt{font-size:18px}.tower .ic{font-size:40px}h1{font-size:24px}}
</style>
</head>
<body>
<div id="sky"></div>
<div id="app"></div>
<script>
"use strict";
/* ============ помічники ============ */
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fr=(n,d)=>`<span class="frac"><span>${n}</span><span>${d}</span></span>`;
function plural(n,f1,f2,f5){const a=Math.abs(n)%100,b=a%10;if(a>10&&a<20)return f5;if(b>1&&b<5)return f2;if(b===1)return f1;return f5}
const TTS=typeof window!=="undefined"&&"speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined";

/* ============ МАТЕМАТИКА (завдання генеруються щоразу нові) ============ */
const M=[];
M[0]=()=>{const a=R(2,9),b=R(2,9);
  if(Math.random()<.55)return{q:`${a} × ${b} = ?`,a:a*b,why:`${a} × ${b} = ${a*b}.`};
  return{q:`${a*b} : ${a} = ?`,a:b,why:`${a*b} : ${a} = ${b}, бо ${b} × ${a} = ${a*b}.`}};
M[1]=()=>{const d=R(3,9),q=R(2,9),r=R(1,d-1),n=q*d+r,s=(x,y)=>`${x} (ост. ${y})`,ok=s(q,r);
  const set=new Set([ok]);[s(q,r===d-1?r-1:r+1),s(q-1,r+d),s(q+1,r),s(q,0),s(q+1,r===1?2:r-1)].forEach(x=>{if(set.size<4)set.add(x)});
  return{q:`${n} : ${d} = ?`,opts:shuffle([...set]),a:ok,why:`${q} × ${d} = ${q*d}, а ${n} − ${q*d} = ${r}. Остача ${r} менша за дільник ${d} — так і має бути.`}};
M[2]=()=>{const a=R(1000,99999),b=R(1000,99999);
  if(Math.random()<.5)return{q:`${a} + ${b} = ?`,a:a+b,why:`${a} + ${b} = ${a+b}. Додаємо по розрядах, починаючи з одиниць.`};
  const x=Math.max(a,b),y=Math.min(a,b);return{q:`${x} − ${y} = ?`,a:x-y,why:`${x} − ${y} = ${x-y}. Перевірка: ${x-y} + ${y} = ${x}.`}};
M[3]=()=>{const d=R(2,9);
  if(Math.random()<.5){const a=R(102,999);return{q:`${a} × ${d} = ?`,a:a*d,why:`${a} × ${d} = ${a*d}.`}}
  const q=R(102,999);return{q:`${q*d} : ${d} = ?`,a:q,why:`${q*d} : ${d} = ${q}. Перевірка: ${q} × ${d} = ${q*d}.`}};
M[4]=()=>{const k=R(2,9)*10;
  if(Math.random()<.5){const a=R(12,99);return{q:`${a} × ${k} = ?`,a:a*k,why:`${a} × ${k/10} = ${a*k/10}, а потім ще × 10: ${a*k}.`}}
  const q=R(12,99);return{q:`${q*k} : ${k} = ?`,a:q,why:`Прибираємо по нулю: ${q*k/10} : ${k/10} = ${q}.`}};
M[5]=()=>{const t=R(0,2);
  if(t===0){const d=R(2,10),k=R(2,12),n=d*k;return{q:`Знайди ${fr(1,d)} від ${n}`,a:k,why:`Ділимо на знаменник: ${n} : ${d} = ${k}.`}}
  if(t===1){const d=R(3,10),m=R(2,d-1),k=R(2,10),n=d*k;return{q:`Знайди ${fr(m,d)} від ${n}`,a:k*m,why:`Спершу ${n} : ${d} = ${k}, потім ${k} × ${m} = ${k*m}.`}}
  const d=R(2,10),v=R(2,12);return{q:`${fr(1,d)} числа дорівнює ${v}.<br>Яке це число?`,a:v*d,why:`Усе число — це ${d} таких частин: ${v} × ${d} = ${v*d}.`}};
const CONV=[
  ()=>{const k=R(1,9),m=R(5,995);return{q:`${k} км ${m} м = ? м`,a:k*1000+m,why:`1 км = 1000 м. ${k} км = ${k*1000} м, і ще ${m} м: ${k*1000+m} м.`}},
  ()=>{const t=R(2,9);return{q:`${t} т = ? кг`,a:t*1000,why:`1 т = 1000 кг. ${t} × 1000 = ${t*1000}.`}},
  ()=>{const c=R(2,9);return{q:`${c} ц = ? кг`,a:c*100,why:`1 ц = 100 кг. ${c} × 100 = ${c*100}.`}},
  ()=>{const h=R(1,4),m=R(1,11)*5;return{q:`${h} год ${m} хв = ? хв`,a:h*60+m,why:`1 год = 60 хв. ${h} год = ${h*60} хв, і ще ${m} хв: ${h*60+m} хв.`}},
  ()=>{const d=R(2,5);return{q:`${d} ${plural(d,"доба","доби","діб")} = ? год`,a:d*24,why:`1 доба = 24 год. ${d} × 24 = ${d*24}.`}},
  ()=>{const m=R(2,9),c=R(1,99);return{q:`${m} м ${c} см = ? см`,a:m*100+c,why:`1 м = 100 см. ${m} м = ${m*100} см, і ще ${c} см: ${m*100+c} см.`}},
  ()=>{const k=R(1,9),g=R(5,995);return{q:`${k} кг ${g} г = ? г`,a:k*1000+g,why:`1 кг = 1000 г. ${k} кг = ${k*1000} г, і ще ${g} г: ${k*1000+g} г.`}},
  ()=>{const h=R(2,8);return{q:`${h*60} хв = ? год`,a:h,why:`1 год = 60 хв. ${h*60} : 60 = ${h}.`}},
  ()=>{const d=R(2,9);return{q:`${d} дм = ? см`,a:d*10,why:`1 дм = 10 см.`}},
  ()=>{const s=R(2,9),mm=R(1,9);return{q:`${s} см ${mm} мм = ? мм`,a:s*10+mm,why:`1 см = 10 мм. ${s} см = ${s*10} мм, і ще ${mm} мм: ${s*10+mm} мм.`}},
  ()=>{const m=R(2,9);return{q:`${m*1000} м = ? км`,a:m,why:`1000 м = 1 км. ${m*1000} : 1000 = ${m}.`}}
];
M[6]=()=>pick(CONV)();
M[7]=()=>{const t=R(0,4),a=R(4,15),b=R(2,a-1),s=R(2,12);
  if(t===0)return{q:`Прямокутник: довжина ${a} см, ширина ${b} см.<br>Знайди периметр (см).`,a:2*(a+b),why:`P = (${a} + ${b}) × 2 = ${2*(a+b)} см.`};
  if(t===1)return{q:`Прямокутник: довжина ${a} см, ширина ${b} см.<br>Знайди площу (см²).`,a:a*b,why:`S = ${a} × ${b} = ${a*b} см².`};
  if(t===2){const k=R(2,25);return{q:`Сторона квадрата ${k} см.<br>Знайди периметр (см).`,a:4*k,why:`У квадрата 4 рівні сторони: ${k} × 4 = ${4*k} см.`}}
  if(t===3)return{q:`Сторона квадрата ${s} см.<br>Знайди площу (см²).`,a:s*s,why:`S = ${s} × ${s} = ${s*s} см².`};
  return{q:`Площа прямокутника ${a*b} см², довжина ${a} см.<br>Знайди ширину (см).`,a:b,why:`Площу ділимо на довжину: ${a*b} : ${a} = ${b} см.`}};
M[8]=()=>{const t=R(0,5);let x,a,b,q,why;
  if(t===0){x=R(10,500);a=R(10,500);b=x+a;q=`x + ${a} = ${b}`;why=`Невідомий доданок: від суми віднімаємо відомий доданок. x = ${b} − ${a} = ${x}.`}
  else if(t===1){a=R(10,500);x=a+R(10,400);b=x-a;q=`x − ${a} = ${b}`;why=`Невідоме зменшуване: до різниці додаємо від'ємник. x = ${b} + ${a} = ${x}.`}
  else if(t===2){a=R(100,900);x=R(10,a-10);b=a-x;q=`${a} − x = ${b}`;why=`Невідомий від'ємник: від зменшуваного віднімаємо різницю. x = ${a} − ${b} = ${x}.`}
  else if(t===3){x=R(2,99);a=R(2,9);b=x*a;q=`x × ${a} = ${b}`;why=`Невідомий множник: добуток ділимо на відомий множник. x = ${b} : ${a} = ${x}.`}
  else if(t===4){a=R(2,9);b=R(2,50);x=a*b;q=`x : ${a} = ${b}`;why=`Невідоме ділене: частку множимо на дільник. x = ${b} × ${a} = ${x}.`}
  else{x=R(2,9);b=R(2,30);a=x*b;q=`${a} : x = ${b}`;why=`Невідомий дільник: ділене ділимо на частку. x = ${a} : ${b} = ${x}.`}
  return{q:`${q}<br><span class="small">Знайди x</span>`,a:x,why}};
M[9]=()=>{const t=R(0,4);let a,b,c,k,q,ans,why;
  if(t===0){a=R(10,90);b=R(2,9);c=R(2,9);ans=a+b*c;q=`${a} + ${b} × ${c}`;why=`Спершу множення: ${b} × ${c} = ${b*c}. Потім ${a} + ${b*c} = ${ans}.`}
  else if(t===1){a=R(2,20);b=R(2,20);c=R(2,9);ans=(a+b)*c;q=`(${a} + ${b}) × ${c}`;why=`Спершу дужки: ${a} + ${b} = ${a+b}. Потім ${a+b} × ${c} = ${ans}.`}
  else if(t===2){b=R(2,9);c=R(2,9);a=b*c+R(5,60);ans=a-b*c;q=`${a} − ${b} × ${c}`;why=`Спершу множення: ${b} × ${c} = ${b*c}. Потім ${a} − ${b*c} = ${ans}.`}
  else if(t===3){b=R(2,9);k=R(2,9);a=b*k;c=R(5,50);ans=k+c;q=`${a} : ${b} + ${c}`;why=`Спершу ділення: ${a} : ${b} = ${k}. Потім ${k} + ${c} = ${ans}.`}
  else{c=R(2,9);k=R(2,9);b=R(2,30);a=b+c*k;ans=k;q=`(${a} − ${b}) : ${c}`;why=`Спершу дужки: ${a} − ${b} = ${c*k}. Потім ${c*k} : ${c} = ${k}.`}
  return{q:`${q} = ?`,a:ans,why}};
M[10]=()=>{const t=R(0,6);
  if(t===0){const a=R(200,500),b=R(20,90),c=R(20,90);return{q:`У чарівній крамниці було ${a} ${plural(a,"флакон","флакони","флаконів")} зілля. У понеділок продали ${b}, а у вівторок — ${c}. Скільки флаконів залишилося?`,a:a-b-c,why:`${a} − ${b} − ${c} = ${a-b-c}.`}}
  if(t===1){const v=R(12,40),h=R(2,5);return{q:`Мітла летить зі швидкістю ${v} км/год. Скільки кілометрів вона пролетить за ${h} ${plural(h,"годину","години","годин")}?`,a:v*h,why:`Відстань = швидкість × час: ${v} × ${h} = ${v*h} км.`}}
  if(t===2){const v=R(15,90),h=R(2,6);return{q:`Дракон пролетів ${v*h} км за ${h} ${plural(h,"годину","години","годин")}. З якою швидкістю він летів (км/год)?`,a:v,why:`Швидкість = відстань : час: ${v*h} : ${h} = ${v} км/год.`}}
  if(t===3){const n=R(3,9),k=R(12,48);return{q:`У кожній із ${n} скриньок — ${k} ${plural(k,"камінець","камінці","камінців")}. Скільки камінців у всіх скриньках?`,a:n*k,why:`${k} × ${n} = ${n*k}.`}}
  if(t===4){const a=R(15,90),k=R(2,4);return{q:`Чарівна книжка коштує ${a} грн, а паличка — у ${k} рази дорожча. Скільки гривень коштують книжка і паличка разом?`,a:a+a*k,why:`Паличка: ${a} × ${k} = ${a*k} грн. Разом: ${a} + ${a*k} = ${a+a*k} грн.`}}
  if(t===5){const a=R(12,60),b=R(3,20);return{q:`Учениці академії посадили ${a} ${plural(a,"троянду","троянди","троянд")}, а тюльпанів — на ${b} більше. Скільки всього квітів посадили?`,a:2*a+b,why:`Тюльпанів: ${a} + ${b} = ${a+b}. Разом: ${a} + ${a+b} = ${2*a+b}.`}}
  const k=R(3,8),e=R(6,25),n=k*e;return{q:`Чарівниця розклала ${n} ${plural(n,"цукерку","цукерки","цукерок")} порівну в ${k} ${plural(k,"кошик","кошики","кошиків")}. Скільки цукерок у кожному кошику?`,a:e,why:`${n} : ${k} = ${e}.`}};

/* ============ УКРАЇНСЬКА МОВА (перша відповідь у списку — правильна) ============ */
const UA=[
[ // будова слова
["Знайди корінь у слові «водичка».",["вод","ичк","а","водич"],"Вод-ичк-а. Корінь вод- — той самий, що в словах «вода», «водяний»."],
["Знайди префікс у слові «переліт».",["пере","літ","іт","пер"],"Пере-літ. Префікс пере- стоїть перед коренем -літ-."],
["Знайди закінчення у слові «книжками».",["ами","ками","и","книжк"],"Книж-к-ами. Слово змінюється: книжка, книжки, книжками. Змінна частина -ами — закінчення."],

const gen=(f,n)=>()=>{const out=[],seen=new Set();let tries=0;while(out.length<n&&tries<300){tries++;const g=f(),k=g.q+"|"+g.a;if(seen.has(k))continue;seen.add(k);out.push(Object.assign({input:!g.opts},g,{a:String(g.a)}))}return out};
function engRound(cat){
  return ()=>shuffle(cat.w).slice(0,8).map(w=>{
    const others=shuffle(cat.w.filter(x=>x!==w)).slice(0,3);
    const types=["uk2en","en2uk"];if(cat.k)types.push("pic2en","pic2en");if(TTS)types.push("listen","listen");
    const ty=pick(types),why=`${w[0]} — ${w[1]}`;
    const picHtml=cat.k==="e"?`<div class="big">${w[2]}</div>`:cat.k==="sw"?`<div class="sw" style="background:${w[2]}"></div>`:cat.k==="num"?`<div class="num">${w[2]}</div>`:"";
    if(ty==="pic2en")return{pic:picHtml,q:"Як це англійською?",opts:shuffle([w,...others].map(x=>x[0])),a:w[0],why,say:w[0]};
    if(ty==="uk2en")return{q:`Як англійською «${w[1]}»?`,opts:shuffle([w,...others].map(x=>x[0])),a:w[0],why,say:w[0]};
    if(ty==="listen")return{q:"Послухай і обери переклад",sayQ:w[0],opts:shuffle([w,...others].map(x=>x[1])),a:w[1],why,pic2:picHtml};
    return{q:`Що означає «${w[0]}»?`,sayQ:w[0],opts:shuffle([w,...others].map(x=>x[1])),a:w[1],why,pic2:picHtml};
  });
}

function key_(k){
  if(!Q||Q.done)return;const it=Q.queue[Q.i];if(!it.input)return;
  if(k==="del")Q.input=Q.input.slice(0,-1);
  else if(k==="ok"){if(Q.input)answer(Q.input.replace(/^0+(?=\d)/,""));return}
  else if(Q.input.length<7)Q.input+=k;
  $("#disp").innerHTML=Q.input||"&nbsp;";
}
document.addEventListener("keydown",e=>{
  if(!Q)return;
  if(Q.done&&(e.key==="Enter"||e.key===" ")){e.preventDefault();const n=$("#next");if(n)n.click();return}
  if(/^\d$/.test(e.key))key_(e.key);else if(e.key==="Backspace")key_("del");else if(e.key==="Enter")key_("ok");
});
function answer(val){
  if(Q.done)return;Q.done=true;const it=Q.queue[Q.i],ok=String(val)===String(it.a);
  if(ok&&!it.retry)Q.correct++;
  if(!ok&&!it.retry)Q.queue.push(Object.assign({},it,{retry:true,opts:it.opts?shuffle(it.opts):undefined}));
  if(it.input)$("#disp").style.color=ok?"var(--ok)":"var(--bad)";
  else $$(".opt").forEach(b=>{const o=it.opts[+b.dataset.i];if(o===it.a)b.classList.add("ok");else if(o===val)b.classList.add("bad");b.disabled=true});
  beep(ok);if(!ok&&navigator.vibrate)try{navigator.vibrate(80)}catch(e){}
  const fb=$("#fb");fb.className="fb "+(ok?"ok":"bad");
  fb.innerHTML=(it.pic2?it.pic2:"")+(ok?`<b>${esc(PRAISE())}</b>`:`<b>${OOPS()}</b><br>Правильна відповідь: <b>${esc(it.a)}</b>`)+(it.why?`<div style="margin-top:6px">${it.why}</div>`:"")+`<button class="btn" id="next">Далі ➜</button>`;
  $("#next").onclick=next;
  if(it.say||it.sayQ)setTimeout(()=>speak(it.say||it.sayQ),250);
  setTimeout(()=>fb.scrollIntoView({behavior:"smooth",block:"end"}),50);
}
function next(){Q.i++;if(Q.i>=Q.queue.length)result();else showQ()}
function result(){
  const ti=Q.ti,li=Q.li,T=TOWERS[ti],L=T.levels[li],k=key(ti,li),p=Q.correct/Q.total;
  const st=p>=.9?3:p>=.7?2:p>=.5?1:0,old=S.stars[k]||0,newArt=st>0&&old===0,rankBefore=rankName();
  if(st>old)S.stars[k]=st;save();const rankAfter=rankName();
  const hasNext=li+1<T.levels.length&&unlocked(ti,li+1);
  h(`<h1>${["Спробуй ще!","Непогано!","Добре!","Неймовірно!"][st]}</h1>
  <div class="stars pop">${[1,2,3].map(i=>`<span class="${i<=st?"":"off"}">⭐</span>`).join("")}</div>
  <div class="sub">З першого разу правильно: ${Q.correct} з ${Q.total}</div>
  ${newArt?`<div class="card center"><div class="big pop">${L.art[0]}</div>Ти отримала артефакт:<br><b style="color:var(--gold);font-size:21px">${L.art[1]}</b></div>`:""}
  ${rankAfter!==rankBefore?`<div class="card center">🎓 Нове звання: <b style="color:var(--gold)">${rankAfter}</b>!</div>`:""}
  ${st===0?`<div class="card">Щоб отримати зірку, треба хоча б половину відповідей правильно з першого разу. Сова вірить у тебе! 🦉</div>`:""}
  ${st>0&&st<3?`<div class="small center">Хочеш три зірки? Спробуй ще раз — завдання будуть трохи інші.</div>`:""}
  <button class="btn" id="again">🔁 Ще раз</button>
  ${hasNext?`<button class="btn" id="nx">➡️ Наступний рівень</button>`:""}
  <button class="btn ghost" id="back">${T.icon} До вежі</button>`);
  Q=null;
  $("#again").onclick=()=>startLevel(ti,li);if(hasNext)$("#nx").onclick=()=>startLevel(ti,li+1);$("#back").onclick=()=>towerScreen(ti);
  if(st>0)beep(true);
}
function bookScreen(){
  const x=TOWERS.map((t,ti)=>`<h2>${t.icon} ${t.name}</h2><div class="arts">${t.levels.map((L,li)=>{const own=(S.stars[key(ti,li)]||0)>0;return`<div class="art${own?"":" no"}"><div class="e">${own?L.art[0]:"❔"}</div>${own?L.art[1]:esc(L.t)}</div>`}).join("")}</div>`).join("");
  h(`<div class="top"><button class="iconbtn" id="back">←</button><h2 style="margin:0">📖 Чарівна книга</h2><span style="width:46px"></span></div>
  <div class="sub">Зібрано ${artCount()} з ${TOWERS.reduce((a,t)=>a+t.levels.length,0)} артефактів · звання: <b>${rankName()}</b></div>${x}`);
  $("#back").onclick=mapScreen;
}
function settingsScreen(){
  h(`<div class="top"><button class="iconbtn" id="back">←</button><h2 style="margin:0">⚙️ Налаштування</h2><span style="width:46px"></span></div>
  <div class="card"><div class="small">Ім'я</div><input class="name" id="nm" maxlength="20" value="${esc(S.name)}"><button class="btn" id="sv">Зберегти ім'я</button></div>
  <button class="btn ghost" id="snd">${S.sound?"🔔 Звук увімкнено":"🔕 Звук вимкнено"}</button>
  <button class="btn ghost" id="opn">${S.open?"🔓 Усі рівні відкрито":"🔒 Рівні відкриваються по черзі"}</button>
  <div class="small center">Для батьків: «усі рівні» — щоб одразу перейти до теми, яку зараз проходять у школі.</div>
  <button class="btn ghost" id="rst" style="margin-top:28px">🗑 Почати спочатку</button>
  ${TTS?"":`<div class="card small">На цьому пристрої не знайшлося синтезу мовлення — англійські слова не озвучуватимуться.</div>`}`);
  $("#back").onclick=mapScreen;
  $("#sv").onclick=()=>{const v=$("#nm").value.trim();if(v){S.name=v;save();mapScreen()}};
  $("#snd").onclick=()=>{S.sound=!S.sound;save();settingsScreen()};
  $("#opn").onclick=()=>{S.open=!S.open;save();settingsScreen()};
  $("#rst").onclick=()=>{if(confirm("Стерти всі зірки й артефакти?")&&confirm("Точно? Повернути не вийде.")){S.stars={};save();mapScreen()}};
}
function boot(){
  const sky=document.getElementById("sky");
  for(let i=0;i<70;i++){const s=document.createElement("div");s.className="star";s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.animationDelay=(Math.random()*3)+"s";if(Math.random()<.2){s.style.width=s.style.height="3px"}sky.appendChild(s)}
  if(TTS&&speechSynthesis.getVoices)speechSynthesis.getVoices();
  S.name?mapScreen():nameScreen();
}
if(!(typeof window!=="undefined"&&window.__TEST)){boot();if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
